name: Dynamic Pricing RL CI Pipeline

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT REPOSITORY
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # SETUP PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # VERIFY PROJECT STRUCTURE
      # =====================================================
      - name: Verify Project Structure
        run: |
          test -f training/train.py
          test -f training/evaluate.py
          test -f env/pricing_env.py
          test -f agents/ppo_agent.py
          test -f agents/dqn_agent.py

      # =====================================================
      # RUN BASIC IMPORT TESTS
      # =====================================================
      - name: Run Import Validation
        run: |
          python -c "from env.pricing_env import DynamicPricingEnv"
          python -c "from agents.ppo_agent import PPOAgent"
          python -c "from agents.dqn_agent import DQNAgent"

      # =====================================================
      # CHECK FASTAPI APP
      # =====================================================
      - name: Validate FastAPI Backend
        run: |
          python -c "from api.app import app"

      # =====================================================
      # DOCKER BUILD VALIDATION
      # =====================================================
      - name: Build Docker Image
        run: |
          docker build -t dynamic-pricing-rl .

      # =====================================================
      # SUCCESS MESSAGE
      # =====================================================
      - name: CI Completed
        run: |
          echo "Dynamic Pricing RL CI pipeline completed successfully."